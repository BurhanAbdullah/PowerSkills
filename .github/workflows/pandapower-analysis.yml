name: Pandapower analysis regression

on:
  push:
    branches:
      - main
      - fix/three-winding-analysis
  pull_request:
    paths:
      - "powerskills-tool/skills/pandapower/scripts/**"
      - ".github/workflows/pandapower-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pandapower-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas pandapower
      - name: Run analysis regression tests
        run: python -m pytest -q powerskills-tool/skills/pandapower/scripts/test_network_analysis.py
      - name: Compile analysis scripts and tests
        run: python -m compileall -q powerskills-tool/skills/pandapower/scripts
